services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reddit_analytics
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d reddit_analytics']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/src
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__Default: Host=postgres;Database=reddit_analytics;Username=postgres;Password=postgres
      RedditSettings__ClientId: ${REDDIT_CLIENT_ID}
      RedditSettings__ClientSecret: ${REDDIT_CLIENT_SECRET}
    ports:
      - '5000:80'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  postgres_data:
