name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Restore backend
        run: dotnet restore backend/src/RedditAnalytics.Api/RedditAnalytics.Api.csproj

      - name: Restore backend tests
        run: dotnet restore backend/tests/RedditAnalytics.Api.Tests/RedditAnalytics.Api.Tests.csproj

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build backend
        run: dotnet build backend/src/RedditAnalytics.Api/RedditAnalytics.Api.csproj --configuration Release

      - name: Test backend
        run: dotnet test backend/tests/RedditAnalytics.Api.Tests/RedditAnalytics.Api.Tests.csproj --configuration Release --no-restore

      - name: Build frontend
        run: cd frontend && npm run build
