name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore backend
        run: |
          dotnet restore backend/src/RedditAnalytics.Api/RedditAnalytics.Api.csproj
      - name: Install frontend dependencies
        run: |
          cd frontend && npm ci
      - name: Build backend
        run: |
          dotnet build backend/src/RedditAnalytics.Api/RedditAnalytics.Api.csproj --configuration Release
      - name: Build frontend
        run: |
          cd frontend && npm run build
