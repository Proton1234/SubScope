name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: rg-subscope-prod
  ACR_NAME: acrsubscopeprod5516
  ACR_LOGIN_SERVER: acrsubscopeprod5516.azurecr.io
  BACKEND_APP_NAME: subscope-api
  FRONTEND_APP_NAME: subscope-frontend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore backend
        run: dotnet restore backend/src/RedditAnalytics.Api/RedditAnalytics.Api.csproj

      - name: Restore backend tests
        run: dotnet restore backend/tests/RedditAnalytics.Api.Tests/RedditAnalytics.Api.Tests.csproj

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build backend
        run: dotnet build backend/src/RedditAnalytics.Api/RedditAnalytics.Api.csproj --configuration Release

      - name: Test backend
        run: dotnet test backend/tests/RedditAnalytics.Api.Tests/RedditAnalytics.Api.Tests.csproj --configuration Release --no-restore

      - name: Build frontend
        run: cd frontend && npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --only-show-errors --name "$ACR_NAME"

      - name: Build and push backend image
        run: |
          docker build \
            --file backend/src/Dockerfile \
            --tag "$ACR_LOGIN_SERVER/subscope-api:${{ github.sha }}" \
            backend/src

          docker push "$ACR_LOGIN_SERVER/subscope-api:${{ github.sha }}"

      - name: Build and push frontend image
        run: |
          docker build \
            --file frontend/Dockerfile \
            --tag "$ACR_LOGIN_SERVER/subscope-frontend:${{ github.sha }}" \
            frontend

          docker push "$ACR_LOGIN_SERVER/subscope-frontend:${{ github.sha }}"

      - name: Update backend Container App image
        run: |
          az containerapp update \
            --only-show-errors \
            --resource-group "$RESOURCE_GROUP" \
            --name "$BACKEND_APP_NAME" \
            --image "$ACR_LOGIN_SERVER/subscope-api:${{ github.sha }}"

      - name: Update frontend Container App image
        run: |
          az containerapp update \
            --only-show-errors \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FRONTEND_APP_NAME" \
            --image "$ACR_LOGIN_SERVER/subscope-frontend:${{ github.sha }}"

      - name: Verify deployed health endpoint
        run: |
          frontend_fqdn="$(az containerapp show \
            --only-show-errors \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FRONTEND_APP_NAME" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"

          for i in {1..20}; do
            response="$(curl --fail --silent "https://$frontend_fqdn/api/health" || true)"
            echo "$response"

            if echo "$response" | grep -q '"status":"Healthy"' && echo "$response" | grep -q '"database":"Connected"'; then
              exit 0
            fi

            sleep 15
          done

          echo "Deployment health check failed."
          exit 1
